name: CI Manual Test

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Check file structure
      run: |
        echo "=== Current directory ==="
        pwd
        ls -la
        echo "=== Check for mnt directory ==="
        ls -la mnt/ || echo "mnt directory not found"
        echo "=== Check for symlink ==="
        ls -la mnt/rust-cli-kiln/ || echo "rust-cli-kiln symlink not found"
        
    - name: Create symlink if needed
      run: |
        if [ ! -L mnt/rust-cli-kiln ]; then
          echo "Creating symlink..."
          mkdir -p mnt
          # This won't work in GitHub Actions, but let's see what happens
          echo "Symlink creation would fail in GitHub Actions"
        fi
        
    - name: Check if quick-check script exists
      run: |
        if [ -f ./mnt/rust-cli-kiln/scripts/testing/quick-check.sh ]; then
          echo "Found quick-check script"
          chmod +x ./mnt/rust-cli-kiln/scripts/testing/quick-check.sh
          ./mnt/rust-cli-kiln/scripts/testing/quick-check.sh
        else
          echo "quick-check script not found, running basic checks"
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo build --release
          cargo test
        fi