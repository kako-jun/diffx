[package]
name = "diffx"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Smart diff for config files. Compare JSON/YAML/TOML/XML semantically. Features: ignore patterns, array tracking, directory compare, JSON/YAML output"
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme = "../README.md"
keywords.workspace = true
categories = ["command-line-utilities", "development-tools"]
exclude.workspace = true
rust-version.workspace = true

[dependencies]
diffx-core = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = "4.5"
colored = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }
similar = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }
dirs = { workspace = true }
regex = { workspace = true }

[build-dependencies]
clap = { workspace = true }
clap_mangen = "0.2"
clap_complete = "4.5"

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
trycmd = "0.15"

# Specification-based tests
[[test]]
name = "spec"
path = "tests/lib.rs"

# trycmd documentation tests
[[test]]
name = "cmd"
path = "tests/cmd.rs"
